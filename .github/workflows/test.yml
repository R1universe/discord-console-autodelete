name: JavaScript checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: node --check autodelete.js
      - name: Mocked runtime and UI tests
        run: node test/test.js
      - name: Read-only diagnostic syntax
        run: node --check diagnostics/runtime-audit.js
      - name: Runtime audit and proxy regression tests
        run: node test/runtime-audit.test.js
      - name: Read-only message queue diagnostic syntax
        run: node --check diagnostics/queue-audit.js
      - name: Outgoing message event correlation audit tests
        run: node test/queue-audit.test.js
